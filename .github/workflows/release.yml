name: Release

# Publishes the package to JSR from a verifiable CI/CD workflow. Because this
# runs in GitHub Actions with `id-token: write`, JSR records build provenance
# and a public transparency-log entry (the "Has provenance" JSR score check).
#
# Triggers:
#   - Pushing a semver tag (e.g. v0.1.1).
#   - Manually via the Actions tab ("Run workflow"). Prefer this when a scope
#     member must be the triggering actor: on a *re-run* GitHub keeps the
#     original `github.actor`, but a fresh manual run uses the person who
#     started it, which JSR's OIDC check requires unless the scope's
#     "require member" setting is disabled.
#
# Prerequisites (one-time on jsr.io):
#   1. Link this GitHub repository in the package settings.
#   2. Either trigger releases as a scope member, or disable
#      "Require the user that triggered the workflow to be a member of this
#      scope" under the scope's GitHub Actions publishing security settings.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for JSR OIDC auth + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No token needed: jsr detects GitHub Actions OIDC automatically.
      - run: npx jsr publish
