name: Release

# Publishes the package to JSR from a verifiable CI/CD workflow. Because this
# runs in GitHub Actions with `id-token: write`, JSR records build provenance
# and a public transparency-log entry (the "Has provenance" JSR score check).
#
# Prerequisites (one-time):
#   1. On jsr.io, open the package Settings and link this GitHub repository.
#   2. Push a semver tag, e.g. `git tag v0.1.1 && git push origin v0.1.1`.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for JSR OIDC auth + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No token needed: jsr detects GitHub Actions OIDC automatically.
      - run: npx jsr publish
